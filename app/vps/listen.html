<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Translation – English</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f4f6fb;
      --surface:  #ffffff;
      --border:   #dde1ef;
      --accent:   #5046e5;
      --accent-h: #6c63ff;
      --danger:   #dc4f4f;
      --text:     #1a1a2e;
      --muted:    #6b7280;
      --green:    #16a34a;
      --yellow:   #d97706;
      --red:      #dc2626;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: var(--text); }
    header p  { margin-top: 0.4rem; font-size: 0.85rem; color: var(--muted);
                letter-spacing: 0.06em; text-transform: uppercase; }

    /* ── Language badge ── */
    .lang-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      padding: 0.5rem 1.4rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    .lang-badge svg {
      width: 16px; height: 16px;
      fill: none; stroke: var(--accent);
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Status badge ── */
    #status-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      user-select: none;
    }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    #status-dot.connecting { background: var(--yellow); animation: pulse 1.2s infinite; }
    #status-dot.listening  { background: var(--green);  animation: pulse 1.2s infinite; }
    #status-dot.error      { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.25; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 0.8rem; }

    #btn-join {
      flex: 1;
      padding: 0.85rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #btn-join:hover:not(:disabled)  { background: var(--accent-h); }
    #btn-join:active:not(:disabled) { transform: scale(0.98); }
    #btn-join:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-leave {
      flex: 1;
      padding: 0.85rem;
      border-radius: 8px;
      border: 2px solid var(--danger);
      background: transparent;
      color: var(--danger);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #btn-leave:hover:not(:disabled) { background: var(--danger); color: #fff; }
    #btn-leave:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Info box ── */
    #info-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      min-height: 64px;
    }

    #info-box strong { color: var(--text); font-weight: 600; }

    /* ── Visualiser ── */
    #visualiser-wrap { display: none; flex-direction: column; gap: 0.4rem; }
    #visualiser-wrap.visible { display: flex; }

    .vis-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }

    #vis-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    #vis-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    #chunk-counter {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>Live Translation</h1>
    <p>Russian sermon &rarr; English</p>
  </header>

  <!-- Static language indicator – English only -->
  <div class="lang-badge">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
               15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    English
  </div>

  <div id="status-wrap">
    <div id="status-dot"></div>
    <span id="status-text">Not connected</span>
  </div>

  <div class="card">
    <div class="btn-row">
      <button id="btn-join">Join</button>
      <button id="btn-leave" disabled>Leave</button>
    </div>

    <div id="info-box">
      Press <strong>Join</strong> to start listening to the English translation.
      Audio plays automatically as the sermon is translated in the preacher's voice.
    </div>

    <div id="visualiser-wrap">
      <span class="vis-label">Incoming audio</span>
      <div id="vis-bar-track"><div id="vis-bar-fill"></div></div>
      <span id="chunk-counter">0 segments received</span>
    </div>
  </div>

  <script>
    // ── DOM refs ─────────────────────────────────────────────────────────────
    const btnJoin        = document.getElementById('btn-join');
    const btnLeave       = document.getElementById('btn-leave');
    const statusDot      = document.getElementById('status-dot');
    const statusText     = document.getElementById('status-text');
    const infoBox        = document.getElementById('info-box');
    const visualiserWrap = document.getElementById('visualiser-wrap');
    const visBarFill     = document.getElementById('vis-bar-fill');
    const chunkCounter   = document.getElementById('chunk-counter');

    // ── State ────────────────────────────────────────────────────────────────
    let ws               = null;
    let audioCtx         = null;
    let scheduledEndTime = 0;
    let chunksReceived   = 0;

    // If more than this many seconds of audio are already queued ahead of the
    // current playback position, abandon the backlog and jump to this chunk.
    const MAX_AHEAD_SECONDS = 6;

    // ── Helpers ──────────────────────────────────────────────────────────────
    function setStatus(state, label) {
      statusDot.className    = state;
      statusText.textContent = label;
    }

    function setInfo(html) { infoBox.innerHTML = html; }

    function wsUrl(path) {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      return `${scheme}://${location.host}${path}`;
    }

    // ── Gapless audio playback ────────────────────────────────────────────────
    // Each incoming binary message is a complete MP3 segment.
    // We decode it and schedule it to start exactly when the previous one ends,
    // using AudioContext time as a monotonic clock.
    //
    // Catch-up logic: if the scheduled queue is more than MAX_AHEAD_SECONDS
    // ahead of the current playback position, we've fallen too far behind live.
    // In that case, reset the schedule and play this chunk immediately, which
    // abandons the stale backlog and snaps back to the most recent translation.
    async function scheduleAudioChunk(arrayBuffer) {
      let audioBuffer;
      try {
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      } catch (err) {
        console.error('Audio decode error:', err);
        return;
      }

      const aheadBy = scheduledEndTime - audioCtx.currentTime;
      if (aheadBy > MAX_AHEAD_SECONDS) {
        // Too far behind — jump to live.
        console.warn(`Audio backlog ${aheadBy.toFixed(1)}s — jumping to live.`);
        scheduledEndTime = 0;
        setInfo(
          `<strong>Caught up to live</strong> — resuming from current translation.`
        );
      }

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      // Start immediately (+ 50 ms safety) if no backlog, otherwise chain.
      const startTime = Math.max(audioCtx.currentTime + 0.05, scheduledEndTime);
      source.start(startTime);
      scheduledEndTime = startTime + audioBuffer.duration;
    }

    function flashVisualiser() {
      chunksReceived++;
      chunkCounter.textContent =
        `${chunksReceived} segment${chunksReceived !== 1 ? 's' : ''} received`;
      visBarFill.style.width = '100%';
      setTimeout(() => { visBarFill.style.width = '0%'; }, 300);
    }

    // ── Join ──────────────────────────────────────────────────────────────────
    btnJoin.addEventListener('click', () => {
      if (ws) return;

      setStatus('connecting', 'Connecting…');
      btnJoin.disabled = true;

      // AudioContext must be created inside a user-gesture handler (browser policy).
      audioCtx         = new AudioContext();
      scheduledEndTime = 0;
      chunksReceived   = 0;
      chunkCounter.textContent = '0 segments received';

      // Always connect to the English channel.
      ws = new WebSocket(wsUrl('/ws/listen/en'));
      ws.binaryType = 'arraybuffer';

      ws.addEventListener('open', () => {
        setStatus('listening', 'Listening · English');
        setInfo(
          `<strong>Connected</strong> — listening to the English translation.<br>
           Audio plays automatically each time a sermon segment is translated.`
        );
        btnLeave.disabled = false;
        visualiserWrap.classList.add('visible');
      });

      ws.addEventListener('message', async (event) => {
        // Every binary message is one complete MP3 audio segment.
        if (event.data instanceof ArrayBuffer && event.data.byteLength > 0) {
          flashVisualiser();
          await scheduleAudioChunk(event.data);
        }
      });

      ws.addEventListener('close', () => {
        if (statusDot.className === 'listening') {
          setStatus('', 'Disconnected');
          setInfo('Connection closed. Press Join to reconnect.');
        }
        cleanup();
      });

      ws.addEventListener('error', () => {
        setStatus('error', 'Connection error');
        setInfo('<strong>Error:</strong> Could not connect to the server. Please try again.');
        cleanup();
      });
    });

    // ── Leave ─────────────────────────────────────────────────────────────────
    btnLeave.addEventListener('click', () => {
      setStatus('', 'Disconnecting…');
      cleanup();
      setInfo('You have left the session. Press Join to rejoin.');
    });

    function cleanup() {
      if (ws && ws.readyState !== WebSocket.CLOSED) ws.close();
      ws = null;

      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
      scheduledEndTime = 0;

      btnJoin.disabled  = false;
      btnLeave.disabled = true;
      visualiserWrap.classList.remove('visible');

      if (statusDot.className !== 'error') setStatus('', 'Not connected');
    }
  </script>
</body>
</html>
